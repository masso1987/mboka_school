# Host nginx site for the Mboka web container (loopback :3110).
# Installed as /etc/nginx/sites-available/school.mboketech.com; `certbot --nginx -d school.mboketech.com`
# then adds the TLS listener and the HTTP -> HTTPS redirect, as for the host's other sites.
server {
    listen 80;
    listen [::]:80;
    server_name school.mboketech.com;

    # Imports (CSV) and receipts stay small; uploads are not served by the app yet.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts exactly two proxies (TRUST_PROXY_HOPS=2).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
