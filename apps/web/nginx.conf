# Serves the SPA and proxies the API on the same origin, so the session cookie stays first-party.
# nginx drops server-level add_header lines in any location that sets its own, so the security
# headers are repeated through the snippet below.
server {
  listen 80;
  root /usr/share/nginx/html;

  set $nosniff "nosniff";
  add_header X-Content-Type-Options $nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options $nosniff always;
  }

  # The service worker and the app entry must always be revalidated, or users keep an old version.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options $nosniff always;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options $nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
