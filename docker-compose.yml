services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mboka
      POSTGRES_USER: mboka
      POSTGRES_PASSWORD: mboka_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mboka -d mboka"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["full"]
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://mboka_app:mboka_app_dev@postgres:5432/mboka?schema=public
      DIRECT_DATABASE_URL: postgresql://mboka:mboka_dev@postgres:5432/mboka?schema=public
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
